name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:plugin
      - run: npm run typecheck
      - run: npm run build
      - run: node dist/cli.js eval
      - run: npm run eval:guards
      - run: node dist/cli.js doctor
      - run: npm run eval:prompts
      - run: npm test
      - name: dist must match src
        run: git diff --exit-code -- dist
